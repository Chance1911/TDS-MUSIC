[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tds-music"
version = "0.1.0"
description = "Target-dominant support-selected wideband MUSIC for UAV RF direction finding"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "h5py>=3.10",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
learning = [
    "torch>=2.2",
    "torchvision>=0.17",
    "pillow>=10.0",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "tqdm>=4.65",
]
analysis = [
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "tqdm>=4.65",
]

[tool.setuptools.packages.find]
where = ["src"]
